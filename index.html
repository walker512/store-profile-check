<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoreProof · 门店资料复查台</title><style>
:root{color-scheme:light;font-family:system-ui,-apple-system,sans-serif;color:#183a37;background:#f1f5ef}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:28px;line-height:1.65}header{padding:30px 0}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;color:#407867}h1{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:16px 0}header p{max-width:670px;color:#59736d}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{border:1px solid #a9c6b8;border-radius:25px;padding:3px 12px;font-size:12px}aside{border-left:4px solid #b48635;background:#fff5d9;padding:16px;border-radius:8px;color:#725624}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{border:1px solid #99b9ac;background:#fff;color:#234a40;border-radius:8px;padding:11px 17px;font:600 14px system-ui;cursor:pointer}button:hover{background:#e1eee5}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:#246652;color:#fff;border-color:#246652}.primary:hover{background:#18503f}fieldset{border:1px solid #b8cfc1;border-radius:12px;background:#fff;padding:20px;margin:20px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}fieldset fieldset{grid-column:1/-1;background:#f8fbf7;margin:8px 0}legend{font-weight:700;padding:0 8px;color:#2b7058}label{display:block;font-size:13px;color:#4c6a60}input,textarea{display:block;width:100%;padding:10px;border:1px solid #a8c3b5;border-radius:6px;background:#fff;color:#193c34;font:15px system-ui;margin-top:5px}input:focus,textarea:focus{outline:2px solid #39886b;outline-offset:2px}input[type=file]{max-width:500px}textarea{height:280px;font:13px monospace}fieldset button{justify-self:start}details{border:1px solid #bbcdc1;border-radius:9px;padding:10px;margin:18px 0}summary{cursor:pointer;color:#466a5d}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#status{min-height:24px;color:#755314;font-weight:600}.stats{display:flex;flex-wrap:wrap;gap:14px}.stats p{background:#ddece2;padding:12px 18px;border-radius:8px;font-weight:650}.result{background:#fff;border:1px solid #b6cdbf;border-radius:12px;margin:20px 0;padding:18px;overflow-wrap:anywhere}.result h3{margin-top:0;color:#236c52}.issue{border-top:1px solid #dfE8e1;padding:12px 0}.issue h4{color:#8c5626;margin:4px 0}.issue p{margin:6px 0}.issue button{margin-top:8px}small{color:#587268}footer{margin:30px 0}@media(max-width:600px){body{padding:16px}fieldset{grid-template-columns:1fr;padding:14px}.toolbar button{width:100%}header{padding:15px 0}.result{padding:12px}}
</style></head><body><header><span class="eyebrow">STOREPROOF / LOCAL RECORD REVIEW</span><h1>资料在各处，核对在一处。</h1><p>把你在门店主页、目录和宣传页看到的信息放在一起。保留原文、证据与复核说明，不让格式归一化抹掉真正的中文差异。</p><div class="chips"><span>本地离线</span><span>无API与密钥</span><span>可恢复项目</span><span>CSV整改清单</span></div></header><aside>这不是微信或搜索引擎检测器。所有资料需你手动提供；差异不代表错误，更不代表排名或AI可见度。不要提交你无权处理的个人资料。</aside><div class="toolbar"><button id="fresh">新建空白项目</button><button id="demo">加载虚构示例</button><button id="save">保存可恢复项目</button></div><label for="restore">恢复本工具保存的本地项目（JSON，不上传）</label><input id="restore" type="file" accept=".json,application/json"><div id="editor"></div><details><summary>高级：JSON输入</summary><label for="input">项目数据</label><textarea id="input" spellcheck="false"></textarea><button id="apply">应用JSON到表单</button></details><div class="toolbar"><button id="run" class="primary">生成资料核对报告 →</button><button id="download" disabled>下载JSON报告</button><button id="csv" disabled>导出CSV整改清单</button></div><p id="status" role="status" aria-live="polite"></p><div id="summary"></div><details><summary>完整JSON结果</summary><pre id="output"></pre></details><footer><small>原型 v0.2 · 不联网、不自动保存；关闭前请保存项目。新建和加载示例会替换未保存输入。资料差异中的“已核对例外”不会删除差异；观察日期或原始值改变后需重新复核。</small></footer><script src="core.js"></script><script src="sample.js"></script><script src="app.js"></script></body></html>
